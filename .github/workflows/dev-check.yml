# Fast pull-request validation: format ratchet, full build (including the plugin and its import check) and ctest.
# Heavy analysis lives in dev-analysis.yml. Nothing here measures performance: shared runners are too noisy.
name: dev-check
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm git cmake ninja clang llvm python hyprland mesa libglvnd
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: python3 tools/dev.py doctor
      - run: python3 tools/dev.py check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-check-reports
          path: |
            build/dev/reports/*.json
            build/dev/logs/
          retention-days: 14
